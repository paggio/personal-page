name: Deploy to GitHub Pages

# main            → https://paggio.github.io/personal-page/
# feature/** push → main stays at the root, the branch is published under /personal-page/preview/
on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (live site)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build main
        working-directory: site-main
        run: |
          npm ci --legacy-peer-deps
          npm run build
          mkdir -p ../dist && cp -r dist/. ../dist/

      - name: Checkout branch (preview)
        if: github.ref != 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          path: site-preview

      - name: Build preview under /personal-page/preview/
        if: github.ref != 'refs/heads/main'
        working-directory: site-preview
        run: |
          npm ci --legacy-peer-deps
          npx tsc
          npx vite build --base=/personal-page/preview/
          mkdir -p ../dist/preview && cp -r dist/. ../dist/preview/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
